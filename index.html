
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VP College - Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #003b73;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 16px;
        }

        /* Navigation */
        nav {
            background: #0074b7;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffdd00;
        }

        /* Main */
        .container {
            width: 90%;
            max-width: 900px;
            margin: 35px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .form-box h2 {
            text-align: center;
            color: #003b73;
            margin-bottom: 25px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0074b7;
            outline: none;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        .radio-group {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }

        .radio-group label {
            font-weight: normal;
        }

        .radio-group input {
            width: auto;
            margin-right: 5px;
        }

        .button-group {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 7px;
            background: #0074b7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #003b73;
        }

        .reset {
            background: #777;
        }

        .reset:hover {
            background: #444;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 7px;
            text-align: center;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #003b73;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 30px;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .form-row {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
                font-size: 14px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>VP College</h1>
        <p>Student Registration Portal</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a>
        <a href="#registration">Registration</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Registration Section -->
    <main class="container" id="registration">

        <div class="form-box">

            <h2>Student Registration Form</h2>

            <form id="registrationForm">

                <!-- Name -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text"
                               id="name"
                               placeholder="Enter your full name"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel"
                               id="mobile"
                               placeholder="Enter mobile number"
                               pattern="[0-9]{10}"
                               required>
                    </div>
                </div>

                <!-- Email and DOB -->
                <div class="form-row">

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email"
                               id="email"
                               placeholder="Enter email address"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date"
                               id="dob"
                               required>
                    </div>

                </div>

                <!-- Course -->
                <div class="form-row">

                    <div class="form-group">
                        <label>Select Course</label>

                        <select id="course" required>
                            <option value="">-- Select Course --</option>
                            <option value="BCS">BCS</option>
                            <option value="BCA">BCA</option>
                            <option value="BBA">BBA</option>
                            <option value="BA">BA</option>
                            <option value="B.Com">B.Com</option>
                            <option value="BSC.CS">BSC.CS</option>
                        </select>

                    </div>

                    <div class="form-group">
                        <label>Year</label>

                        <select id="year" required>
                            <option value="">-- Select Year --</option>
                            <option value="First Year">First Year</option>
                            <option value="Second Year">Second Year</option>
                            <option value="Third Year">Third Year</option>
                        </select>

                    </div>

                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Male"
                                   required>
                            Male
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Other">
                            Other
                        </label>

                    </div>
                </div>

                <br>

                <!-- Address -->
                <div class="form-group">
                    <label>Address</label>

                    <textarea id="address"
                              placeholder="Enter your full address"
                              required></textarea>
                </div>

                <br>

                <!-- Password -->
                <div class="form-row">

                    <div class="form-group">
                        <label>Password</label>

                        <input type="password"
                               id="password"
                               placeholder="Enter password"
                               minlength="6"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>

                        <input type="password"
                               id="confirmPassword"
                               placeholder="Confirm password"
                               required>
                    </div>

                </div>

                <!-- Photo -->
                <div class="form-group">

                    <label>Student Photo</label>

                    <input type="file"
                           id="photo"
                           accept="image/*"
                           required>

                </div>

                <!-- Buttons -->
                <div class="button-group">

                    <button type="submit">
                        Register Now
                    </button>

                    <button type="reset"
                            class="reset">
                        Reset
                    </button>

                </div>

            </form>

            <!-- Success Message -->
            <div id="message">
                Registration Successful! Welcome to VP College.
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 VP College | Student Registration Portal</p>
        <p>Designed using HTML, CSS & JavaScript</p>
    </footer>


    <!-- JavaScript -->
    <script>

        document
            .getElementById("registrationForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let password =
                    document.getElementById("password").value;

                let confirmPassword =
                    document.getElementById("confirmPassword").value;

                let message =
                    document.getElementById("message");

                // Password validation
                if (password !== confirmPassword) {

                    alert("Password and Confirm Password do not match!");

                    return;
                }

                // Show success message
                message.style.display = "block";

                // Scroll to message
                message.scrollIntoView({
                    behavior: "smooth"
                });

                // Show alert
                alert("Student Registration Successful!");

            });


        // Reset message
        document
            .getElementById("registrationForm")
            .addEventListener("reset", function() {

                document.getElementById("message").style.display = "none";

            });

    </script>

</body>
</html>
